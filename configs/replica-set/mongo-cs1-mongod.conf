# Reference excerpt for rs0 member mongo-cs1. Merge with existing configuration;
# preserve systemLog, storage, and processManagement sections.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
storage:
  dbPath: /var/lib/mongo
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
net:
  port: 27017
  bindIp: 127.0.0.1,192.168.56.10
security:
  authorization: enabled
  keyFile: /etc/mongodb-replica-key
replication:
  replSetName: rs0
