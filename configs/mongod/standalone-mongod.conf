# Reference configuration for the original standalone mongo-cs1 state.
# In the final replica-set state, mongo-cs1 is configured with replica-set
# settings and a private-interface bind address. Do not overwrite that final
# configuration with this standalone reference.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
storage:
  dbPath: /var/lib/mongo
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
net:
  port: 27017
  bindIp: 127.0.0.1
security:
  authorization: enabled
